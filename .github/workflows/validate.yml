name: Validate articles

on:
  pull_request:
    paths:
      - "docs/**"
  push:
    branches: [main]
    paths:
      - "docs/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate article structure, sanitization, duplicates
        run: python3 scripts/validate_articles.py
